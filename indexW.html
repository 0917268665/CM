<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世興-自動填單系統</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        
        .section { margin-bottom: 25px; padding: 20px; background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; }
        .section-title { font-weight: bold; color: #007bff; margin-bottom: 15px; font-size: 1.1em; border-left: 4px solid #007bff; padding-left: 10px; }

        .grid-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 10px; }
        .grid-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 10px; }
        .full-width { grid-column: span 2; }

        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.95em; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        input:focus, textarea:focus { border-color: #007bff; outline: none; background: #f9fcff; }
        textarea { resize: vertical; height: 80px; }

        .auto-field { background-color: #e9ecef; color: #495057; cursor: not-allowed; font-weight: bold; }
        
        .btn-group { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        button { flex: 1; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: 0.3s; min-width: 200px;}
        button:disabled { background-color: #ccc !important; cursor: not-allowed; }
        
        .btn-deposit { background-color: #17a2b8; }
        .btn-deposit:hover { background-color: #138496; }
        
        .btn-op { background-color: #e67e22; }
        .btn-op:hover { background-color: #d35400; }
        
        /* 新增委託書按鈕樣式 */
        .btn-w { background-color: #28a745; }
        .btn-w:hover { background-color: #218838; }

        .tag-info { background: #d1ecf1; color: #0c5460; padding: 15px; border-radius: 4px; font-size: 0.9em; margin-bottom: 20px; border: 1px solid #bee5eb; }

        /* 票期選項按鈕樣式 */
        .ticket-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 兩列排列 */
            gap: 10px;
            margin-bottom: 15px;
        }
        .ticket-option-label {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            background-color: #fafafa;
            transition: all 0.2s;
        }
        .ticket-option-label:hover {
            background-color: #eef6ff;
            border-color: #007bff;
        }
        .ticket-option-label input {
            width: auto;
            margin-right: 10px;
        }
        .ticket-option-label span {
            font-size: 14px;
            font-weight: bold;
        }
        /* 選中狀態 */
        .ticket-option-label:has(input:checked) {
            background-color: #e7f1ff;
            border-color: #007bff;
            color: #0056b3;
        }

        /* 備註範本按鈕樣式 (新增) */
        .template-area { margin-top: 8px; }
        .template-btn {
            display: inline-block;
            background-color: #f1f3f5;
            border: 1px solid #ced4da;
            color: #495057;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 20px;
            cursor: pointer;
            margin-right: 6px;
            margin-bottom: 6px;
            transition: 0.2s;
            text-align: left;
            flex: none; /* 覆蓋全域 button flex 設定 */
            width: auto; /* 覆蓋全域 button width 設定 */
            min-width: auto;
        }
        .template-btn:hover { background-color: #e2e6ea; border-color: #adb5bd; color: #333; }

        @media (min-width: 600px) {
            .ticket-options { grid-template-columns: repeat(4, 1fr); } /* 寬螢幕變四列 */
        }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
</head>
<body>

<div class="container">
    <h1>✈️ 世興-自動填單系統</h1>

    <div class="section">
        <div class="section-title">1. 快速貼上 (自動解析團號/日期)</div>
        <textarea id="rawInput" placeholder="範例：昇級版~清州...  CJJ05260206A" oninput="parseRawData()"></textarea>
    </div>

    <div class="section">
        <div class="section-title">2. 詳細資料輸入</div>
        
        <div class="grid-row">
            <div><label>填單日期</label><input type="date" id="inputFillDate"></div>
            <div><label>團號</label><input type="text" id="inputGroupCode" class="auto-field" readonly></div>
        </div>

        <div class="grid-row"><div class="full-width"><label>產品名稱</label><input type="text" id="inputGroupName"></div></div>

        <div class="grid-row">
            <div><label>旅行社名稱 ({agency})</label><input type="text" id="inputAgency" value="旅行社"></div>
            <div><label>AGT 名字 ({agent})</label><input type="text" id="inputAgent" value=""></div>
        </div>

        <div class="grid-row">
            <div><label>航空公司</label><input type="text" id="inputAirline" value="航空"></div>
            <div><label>行動電話</label><input type="text" id="inputMobile" value=""></div>
        </div>

        <hr style="border: 0; border-top: 1px dashed #ccc; margin: 20px 0;">

        <div class="grid-row-3">
            <div><label>大人人數 ({paxAdult})</label><input type="number" id="inputAdults" value="" min="0" oninput="calculateTotal()"></div>
            <div><label>小孩人數 ({paxChild})</label><input type="number" id="inputChildren" value="" min="0" oninput="calculateTotal()"></div>
            <div><label>總人數 ({paxTotal})</label><input type="number" id="inputPaxTotal" class="auto-field" readonly></div>
        </div>

        <div class="grid-row">
            <div><label>團費 ({fee})</label><input type="text" id="inputFee" value=""></div>
            <div><label>成團門檻 (人)</label><input type="number" id="inputMinPax" value="16"></div>
        </div>

        <div class="grid-row">
            <div><label>每人訂金</label><input type="number" id="inputDepositUnit" value="" oninput="calculateTotal()"></div>
            <div><label>訂金總金額 (自動計算)</label><input type="text" id="outputTotalDeposit" class="auto-field" readonly></div>
        </div>

        <div class="grid-row">
            <div><label>小費 (每人每天)</label><input type="number" id="inputTips" value="300"></div>
            <div><label>訂金繳交期限</label><input type="text" id="inputDepositDeadline" placeholder="例: 1/15 17:00前"></div>
        </div>

        <div class="grid-row">
            <div class="full-width">
                <label>備註事項</label>
                <textarea id="inputRemarks" placeholder="輸入額外備註..."></textarea>
                
                <div class="template-area">
                    <label style="font-size:13px; color:#666; margin-bottom:5px; display:block;">👇 快速插入範本 (點擊加入)：</label>
                    <button class="template-btn" onclick="addRemark('本團航班為廉價航空，付訂後不可更改日期或取消。')">1. 廉航</button>
                    <button class="template-btn" onclick="addRemark('本團航班為包機，付訂後不可更改日期或取消。')">2. 包機</button>
                    <button class="template-btn" onclick="addRemark('本團航班為包銷，付訂後不可更改日期或取消。')">3. 包銷</button>
                    <button class="template-btn" onclick="addRemark('本團為過年機位，付訂後不可更改日期或取消。')">4. 過年機位</button>
                    <button class="template-btn" onclick="addRemark('本團為連續假期機位，付訂後不可更改日期或取消。')">5. 連假機位</button>
                </div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">3. 票期與業務</div>
        
        <label>票期推算規則 (點選自動計算)(有時無法抓到全部放假日，請再自行驗算一下)：</label>
        <div class="ticket-options">
            <label class="ticket-option-label">
                <input type="radio" name="ticketRule" value="normal" checked onchange="recalcDates()">
                <span>1. 正常<br><small style="font-weight:normal; color:#666;">(訂-7 / 尾-5)</small></span>
            </label>
            <label class="ticket-option-label">
                <input type="radio" name="ticketRule" value="lcc" onchange="recalcDates()">
                <span>2. 廉航<br><small style="font-weight:normal; color:#666;">(訂-15 / 尾-5)</small></span>
            </label>
            <label class="ticket-option-label">
                <input type="radio" name="ticketRule" value="out" onchange="recalcDates()">
                <span>3. 外縣市<br><small style="font-weight:normal; color:#666;">(訂-10 / 尾-8)</small></span>
            </label>
            <label class="ticket-option-label">
                <input type="radio" name="ticketRule" value="lcc_out" onchange="recalcDates()">
                <span>4. 廉航+外縣市<br><small style="font-weight:normal; color:#666;">(訂-18 / 尾-8)</small></span>
            </label>
        </div>

        <div class="grid-row-3">
            <div><label>出發日期 (西元)</label><input type="text" id="outputDepartureDate" class="auto-field" readonly></div>
            <div><label>回程日期 (自動推算)</label><input type="text" id="outputReturnDate" class="auto-field" readonly></div>
            <div><label>業務專員</label>
                <select id="salesSelect">
                    <option value="陳彥百|0917-268665">陳彥百 0917-268665</option>
                    <option value="王麗芬|0937-019875">王麗芬 0937-019875</option>
                    <option value="蔡雅筑|0920-277072">蔡雅筑 0920-277072</option>
                    <option value="劉玉薇|0989-439193">劉玉薇 0989-439193</option>
                </select>
            </div>
        </div>
        <div class="grid-row">
            <div><label>訂金票期 (工作天)</label><input type="text" id="outputCheckDepositDate" class="auto-field" readonly></div>
            <div><label>尾款票期 (工作天)</label><input type="text" id="outputCheckFinalDate" class="auto-field" readonly></div>
        </div>
    </div>

    <div class="btn-group">
        <button id="btnDeposit" class="btn-deposit" onclick="generate('deposit')" disabled>📥 下載訂金單</button>
        <button id="btnOp" class="btn-op" onclick="generate('op')" disabled>📥 下載作業金單</button>
        <button id="btnW" class="btn-w" onclick="generate('w')" disabled>📥 下載同業委託操作契約書</button>
    </div>
</div>

<script>
    const holidays2026 = ['2026-01-01', '2026-02-16', '2026-02-17', '2026-02-18', '2026-02-19', '2026-02-20', '2026-02-28', '2026-04-03', '2026-04-06', '2026-05-01', '2026-06-19', '2026-09-25', '2026-10-10'];
    
    // ★★★ 您的 Google Apps Script 追蹤網址 (已保留) ★★★
    const TRACKER_URL = 'https://script.google.com/macros/s/AKfycby4PWsogyFH09g2Q3NtSeZbQrFI6by87s7Uh6dTBCSHqxCsyUIrhiDq8CkFMNDLg1Us/exec';

    window.onload = function() {
        document.getElementById('inputFillDate').valueAsDate = new Date();
        calculateTotal();
    };

    function parseRawData() {
        const raw = document.getElementById('rawInput').value;
        const match = raw.match(/[A-Z]{3}\d{2}(\d{6})[A-Z0-9]*/);
        const fullCodeMatch = raw.match(/([A-Z]{3}\d{8}[A-Z0-9]*)/);

        if (fullCodeMatch && match) {
            const fullCode = fullCodeMatch[1];
            let name = raw.replace(fullCode, '').trim().replace(/[　\s]+$/, '');
            
            document.getElementById('inputGroupCode').value = fullCode;
            document.getElementById('inputGroupName').value = name;
            
            const dateStr6 = match[1];
            const y = "20" + dateStr6.substring(0, 2);
            const m = dateStr6.substring(2, 4);
            const d = dateStr6.substring(4, 6);
            const depDateStr = `${y}/${m}/${d}`;
            document.getElementById('outputDepartureDate').value = depDateStr;
            
            // 自動計算回程日期
            const daysStr = fullCode.substring(3, 5); // 取得團號第4、5字元 (索引3、4)
            const days = parseInt(daysStr, 10);
            if (!isNaN(days) && days > 0) {
                let retDate = new Date(depDateStr);
                retDate.setDate(retDate.getDate() + (days - 1)); // 出發日也算1天
                const ry = retDate.getFullYear();
                const rm = String(retDate.getMonth() + 1).padStart(2, '0');
                const rd = String(retDate.getDate()).padStart(2, '0');
                document.getElementById('outputReturnDate').value = `${ry}/${rm}/${rd}`;
            } else {
                document.getElementById('outputReturnDate').value = "";
            }

            recalcDates();
            checkBtnStatus();
        }
    }

    // 新增：插入備註功能
    function addRemark(text) {
        const el = document.getElementById('inputRemarks');
        if (el.value.trim() !== "") {
            el.value += "\n" + text; // 換行加入
        } else {
            el.value = text;
        }
    }

    function recalcDates() {
        const depStr = document.getElementById('outputDepartureDate').value;
        if (!depStr) return;

        const depDate = new Date(depStr);
        const rule = document.querySelector('input[name="ticketRule"]:checked').value;
        
        let depositDays = 7;
        let finalDays = 5;

        if (rule === 'lcc') {
            depositDays = 15;
            finalDays = 5;
        } else if (rule === 'out') {
            depositDays = 10;
            finalDays = 8;
        } else if (rule === 'lcc_out') {
            depositDays = 18;
            finalDays = 8;
        }

        document.getElementById('outputCheckDepositDate').value = toTwDate(subtractWorkDays(depDate, depositDays));
        document.getElementById('outputCheckFinalDate').value = toTwDate(subtractWorkDays(depDate, finalDays));
    }

    function calculateTotal() {
        const adults = parseInt(document.getElementById('inputAdults').value) || 0;
        const children = parseInt(document.getElementById('inputChildren').value) || 0;
        const unit = parseInt(document.getElementById('inputDepositUnit').value) || 0;
        
        const total = adults + children;
        document.getElementById('inputPaxTotal').value = total;
        document.getElementById('outputTotalDeposit').value = (total * unit).toLocaleString();
    }

    function checkBtnStatus() {
        const hasCode = document.getElementById('inputGroupCode').value !== "";
        document.getElementById('btnDeposit').disabled = !hasCode;
        document.getElementById('btnOp').disabled = !hasCode;
        document.getElementById('btnW').disabled = !hasCode; // 控制新按鈕
    }

    function formatPax(val) {
        if (val === "" || val === null || val === undefined) return "";
        return val + "位";
    }

    function generate(type) {
        // 觸發上傳到追蹤系統
        uploadToTracker(); 

        let fileName, outputSuffix;
        if (type === 'deposit') {
            fileName = 'template_deposit.docx';
            outputSuffix = '訂金單';
        } else if (type === 'op') {
            fileName = 'template_op.docx';
            outputSuffix = '作業金單';
        } else if (type === 'w') {
            fileName = 'template_W.docx';
            outputSuffix = '同業委託操作契約書';
        }

        fetch(fileName)
            .then(response => {
                if (!response.ok) throw new Error(`找不到 ${fileName}，請確認檔案在同一目錄下。`);
                return response.arrayBuffer();
            })
            .then(content => {
                const zip = new PizZip(content);
                const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });

                const salesVal = document.getElementById('salesSelect').value.split('|');
                const agency = document.getElementById('inputAgency').value;
                const agent = document.getElementById('inputAgent').value;
                const paxTotal = document.getElementById('inputPaxTotal').value;

                let groupName = document.getElementById('inputGroupName').value;
                if (groupName.length > 25) {
                    groupName = groupName.substring(0, 25) + "\n" + groupName.substring(25);
                }

                doc.render({
                    agency: agency,
                    agent: agent,
                    clientName: `${agency} ${agent}`, 
                    
                    paxAdult: formatPax(document.getElementById('inputAdults').value),
                    paxChild: formatPax(document.getElementById('inputChildren').value),
                    paxTotal: formatPax(paxTotal),
                    pax: formatPax(paxTotal), 

                    groupCode: document.getElementById('inputGroupCode').value,
                    groupName: groupName, 
                    date: document.getElementById('outputDepartureDate').value,
                    returndate: document.getElementById('outputReturnDate') ? document.getElementById('outputReturnDate').value : '', // 寫入回程日期
                    fillDate: toTwDateSimple(document.getElementById('inputFillDate').value),
                    airline: document.getElementById('inputAirline').value,
                    mobile: document.getElementById('inputMobile').value,
                    minPax: document.getElementById('inputMinPax').value,
                    
                    fee: document.getElementById('inputFee').value,
                    
                    depositUnit: parseInt(document.getElementById('inputDepositUnit').value).toLocaleString(),
                    totalDeposit: document.getElementById('outputTotalDeposit').value,
                    tips: document.getElementById('inputTips').value,
                    depositDeadline: document.getElementById('inputDepositDeadline').value,
                    checkDepositDate: document.getElementById('outputCheckDepositDate').value,
                    checkFinalDate: document.getElementById('outputCheckFinalDate').value,
                    remarks: document.getElementById('inputRemarks').value,
                    salesName: salesVal[0],
                    salesPhone: salesVal[1]
                });

                const out = doc.getZip().generate({
                    type: "blob",
                    mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                });
                
                let agencyShort = agency.replace(/旅行社/g, ""); 
                let fileNameString = `${document.getElementById('inputGroupCode').value}${agencyShort}${paxTotal}位${outputSuffix}.docx`;
                
                saveAs(out, fileNameString);
            })
            .catch(error => {
                console.error(error);
                alert("❌ 生成失敗：\n" + error.message);
            });
    }

    function subtractWorkDays(startDate, workDays) {
        let d = new Date(startDate);
        let count = 0;
        while (count < workDays) {
            d.setDate(d.getDate() - 1);
            const day = d.getDay();
            const ymd = d.toISOString().split('T')[0];
            if (day !== 0 && day !== 6 && !holidays2026.includes(ymd)) count++;
        }
        return d;
    }

    function toTwDateSimple(dateStr) {
        const d = new Date(dateStr);
        return isNaN(d) ? "" : `${d.getFullYear()-1911}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}`;
    }

    function toTwDate(d) {
        return `${d.getFullYear()-1911}年${(d.getMonth()+1).toString().padStart(2,'0')}月${d.getDate().toString().padStart(2,'0')}日`;
    }

    function uploadToTracker() {
        const salesRaw = document.getElementById('salesSelect').value; 
        
        if (!salesRaw.includes("陳彥百")) {
            console.log("非陳彥百的訂單，略過上傳。");
            return; 
        }

        if (!TRACKER_URL || TRACKER_URL.includes("您的ID")) {
            console.warn("尚未設定追蹤系統 URL");
            return;
        }

        const groupCode = document.getElementById('inputGroupCode').value;
        const agency = document.getElementById('inputAgency').value;
        const agent = document.getElementById('inputAgent').value;
        const remark = document.getElementById('inputRemarks').value;
        
        const pax = document.getElementById('inputPaxTotal').value || 0; 
        const phone = document.getElementById('inputMobile').value || ""; 
        
        const agtCombined = `${agency} ${agent}`.trim();

        if (!groupCode) return; 

        const formData = new FormData();
        formData.append('action', 'add');
        formData.append('groupCode', groupCode);
        formData.append('agt', agtCombined);
        
        formData.append('pax', pax);
        formData.append('phone', phone);
        
        formData.append('remark', remark);

        fetch(TRACKER_URL, {
            method: 'POST',
            body: formData,
            mode: 'no-cors' 
        }).then(() => {
            console.log(`訂單 ${groupCode} 已發送至追蹤系統`);
        }).catch(err => {
            console.error('上傳追蹤系統失敗:', err);
        });
    }
</script>
</body>
</html>
